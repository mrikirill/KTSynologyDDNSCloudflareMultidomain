name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        description: Set the version for the release in the format v1.0.0

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Build linuxX64
        run: ./gradlew build -PtargetPlatform=linuxX64

      - name: Upload linuxX64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: KTSynologyDDNSCloudflareMultidomainLinuxX64
          path: build/bin/native/releaseExecutable/KTSynologyDDNSCloudflareMultidomain.kexe

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture arm64
          
          if [ -f /etc/apt/sources.list ]; then
              sudo sed -i 's/^deb /deb [arch=amd64] /g' /etc/apt/sources.list
          fi
          
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sudo sed -i 's/^Types: deb$/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources
          fi
          
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ $(lsb_release -cs) main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ $(lsb_release -cs)-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ $(lsb_release -cs)-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          
          sudo apt-get update
          
          sudo apt-get remove -y libcurl4-openssl-dev || true
          sudo apt-get install -y libcurl4-openssl-dev:arm64

      - name: Build linuxArm64
        run: ./gradlew build -PtargetPlatform=linuxArm64

      - name: Upload linuxArm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: KTSynologyDDNSCloudflareMultidomainLinuxArm64
          path: build/bin/native/releaseExecutable/KTSynologyDDNSCloudflareMultidomain.kexe

  release:
    needs: [build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    steps:
      - name: Download linuxX64 artifact
        uses: actions/download-artifact@v4
        with:
          name: KTSynologyDDNSCloudflareMultidomainLinuxX64
          path: build_output/linux_amd64

      - name: Download linuxArm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: KTSynologyDDNSCloudflareMultidomainLinuxArm64
          path: build_output/linux_arm64

      - name: Rename artifacts
        run: |
          mv build_output/linux_amd64/KTSynologyDDNSCloudflareMultidomain.kexe build_output/linux_amd64/KTSynologyDDNSCloudflareMultidomainLinuxX64.kexe
          mv build_output/linux_arm64/KTSynologyDDNSCloudflareMultidomain.kexe build_output/linux_arm64/KTSynologyDDNSCloudflareMultidomainLinuxArm64.kexe

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: |
            build_output/linux_amd64/KTSynologyDDNSCloudflareMultidomainLinuxX64.kexe
            build_output/linux_arm64/KTSynologyDDNSCloudflareMultidomainLinuxArm64.kexe
          generate_release_notes: true
          make_latest: true